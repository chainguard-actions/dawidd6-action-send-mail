name: Test html_body, convert_markdown, ignore_cert, secure inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "465"
          secure: "true"
          ignore_cert: "true"
          username: testuser
          password: testpass
          subject: "Test email with HTML body and markdown"
          to: recipient@example.com
          from: sender@example.com
          html_body: "<h1>Hello</h1><p>This is an HTML email.</p>"
          convert_markdown: "false"
      - name: Assert action ran (expected to fail - no real SMTP server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real SMTP server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
