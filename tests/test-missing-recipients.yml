name: Test missing recipients fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "Test Email"
          from: sender@example.com
          body: "Hello!"
          # No to, cc, or bcc provided

      - name: Assert action failed with missing recipients error
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no recipients are provided, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no recipients were specified"
