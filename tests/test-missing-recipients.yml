name: Test missing recipients
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: "smtp.example.com"
          server_port: "25"
          subject: "Test Subject"
          from: "sender@example.com"
          body: "Test body"
          # to, cc, and bcc are all intentionally omitted to trigger validation error
      - name: Assert action failed with missing recipients error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no recipients (to/cc/bcc) are provided, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no recipients were provided"
