name: Test validation - no recipients
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "Test Email"
          from: sender@example.com
          # Intentionally omitting to, cc, and bcc to trigger validation error

      - name: Assert step failed with validation error
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail when no recipients are specified, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step correctly failed when no recipients specified"
