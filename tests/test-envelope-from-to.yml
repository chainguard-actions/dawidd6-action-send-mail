name: Test envelope_from and envelope_to inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "25"
          username: testuser
          password: testpass
          subject: "Test email with custom envelope"
          to: recipient@example.com
          from: "Sender Name <sender@example.com>"
          body: "Test body with custom envelope"
          envelope_from: bounce@example.com
          envelope_to: delivery@example.com,delivery2@example.com
      - name: Assert action ran (expected to fail - no real SMTP server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real SMTP server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
