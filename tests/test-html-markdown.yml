name: Test HTML body with markdown conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local SMTP sink
        run: |
          rm -rf /tmp/mail-md && mkdir -p /tmp/mail-md
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/smtp_server.py" 2526 /tmp/mail-md > /tmp/smtp-md.log 2>&1 &
          for i in $(seq 1 40); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',2526),1).close()" 2>/dev/null; then
              echo "SMTP sink is up"; exit 0
            fi
            sleep 0.5
          done
          echo "FAIL: SMTP sink did not start"; cat /tmp/smtp-md.log; exit 1
      - id: action
        uses: .
        with:
          server_address: 127.0.0.1
          server_port: "2526"
          subject: Markdown test
          from: sender@example.com
          to: recipient@example.com
          html_body: |
            # Heading

            Some **bold** text
          convert_markdown: "true"
      - name: Assert HTML converted
        run: |
          sleep 1
          cat /tmp/smtp-md.log
          MSG=/tmp/mail-md/msg-1.eml
          if [ ! -f "$MSG" ]; then echo "FAIL: no message received"; exit 1; fi
          cat "$MSG"
          grep -qi '^Content-Type: text/html' "$MSG" || { echo "FAIL: not text/html"; exit 1; }
          grep -q 'Heading</h1>' "$MSG" || { echo "FAIL: h1 not rendered"; exit 1; }
          grep -q '<strong>bold</strong>' "$MSG" || { echo "FAIL: bold not rendered"; exit 1; }
          if grep -q '\*\*bold\*\*' "$MSG"; then echo "FAIL: raw markdown present"; exit 1; fi
          echo "PASS"
