name: Test HTML body with markdown conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake SMTP server
        run: |
          rm -rf /tmp/smtp-out && mkdir -p /tmp/smtp-out
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/smtp-server.cjs" 2525 /tmp/smtp-out > /tmp/smtp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if node -e "require('net').connect(2525,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              echo "server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/smtp-server.log
          exit 1
      - name: Write markdown file
        run: |
          printf '# Release Notes\n\nSome **bold** text\n' > /tmp/body.md
      - id: action
        uses: .
        with:
          server_address: 127.0.0.1
          server_port: "2525"
          subject: Markdown test
          to: bob@example.com
          from: sender@example.com
          html_body: file:///tmp/body.md
          convert_markdown: "true"
      - name: Assert HTML converted
        run: |
          f=/tmp/smtp-out/msg-1.eml
          if [ ! -f "$f" ]; then echo "FAIL: no message received"; cat /tmp/smtp-out/session.log || true; exit 1; fi
          cat "$f"
          grep -qi '^Content-Type: text/html' "$f" || { echo "FAIL: no text/html part"; exit 1; }
          grep -q '<h1' "$f" || { echo "FAIL: markdown heading not converted to <h1>"; exit 1; }
          grep -q 'Release Notes</h1>' "$f" || { echo "FAIL: heading text missing"; exit 1; }
          grep -q '<strong>bold</strong>' "$f" || { echo "FAIL: bold not converted"; exit 1; }
          if grep -q '^# Release Notes' "$f"; then echo "FAIL: raw markdown present"; exit 1; fi
          echo "PASS"
