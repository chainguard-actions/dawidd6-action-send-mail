name: Test HTML body and advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local SMTP server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/smtp_server.py" localhost 1025 &
          echo "SMTP_PID=$!" >> $GITHUB_ENV
          sleep 2

      - id: send
        uses: .
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "HTML Test Email"
          from: "Test Sender <sender@example.com>"
          to: recipient@example.com
          cc: cc@example.com
          bcc: bcc@example.com
          reply_to: replyto@example.com
          html_body: "<h1>Hello</h1><p>This is an <strong>HTML</strong> email.</p>"
          priority: high

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with HTML body and options, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: HTML email with advanced options sent successfully"

      - name: Stop SMTP server
        if: always()
        run: |
          if [ -n "$SMTP_PID" ]; then
            kill "$SMTP_PID" 2>/dev/null || true
          fi
