name: Test invalid from address
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: "smtp.example.com"
          server_port: "25"
          subject: "Test Subject"
          from: "not-a-valid-email-address"
          to: "recipient@example.com"
          body: "Test body"
          # 'from' is not a valid email address — should fail with "'from' address is invalid"
      - name: Assert action failed with invalid from address error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid from address"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with an invalid from address"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
