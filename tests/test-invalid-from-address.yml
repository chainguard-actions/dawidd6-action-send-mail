name: Test invalid from address
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: "smtp.example.com"
          server_port: "25"
          subject: "Test Subject"
          from: "not-a-valid-email-address"
          to: "recipient@example.com"
          body: "Test body"
      - name: Assert action failed with invalid from address error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'from' address is invalid, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when 'from' address was invalid"
