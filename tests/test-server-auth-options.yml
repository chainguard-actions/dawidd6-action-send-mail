name: Test server_address with username/password and transport options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local SMTP sink
        run: |
          rm -rf /tmp/mail-auth && mkdir -p /tmp/mail-auth
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/smtp_server.py" 2531 /tmp/mail-auth > /tmp/smtp-auth.log 2>&1 &
          for i in $(seq 1 40); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',2531),1).close()" 2>/dev/null; then
              echo "SMTP sink is up"; exit 0
            fi
            sleep 0.5
          done
          echo "FAIL: SMTP sink did not start"; cat /tmp/smtp-auth.log; exit 1
      - id: action
        uses: .
        with:
          server_address: 127.0.0.1
          server_port: "2531"
          secure: "false"
          username: authuser
          password: p4ssw0rd
          ignore_cert: "true"
          nodemailerlog: "true"
          nodemailerdebug: "true"
          subject: Auth options test
          from: Sender Name <sender@example.com>
          to: recipient@example.com
          body: Sent with explicit username and password
      - name: Assert message received with credentials
        run: |
          sleep 1
          cat /tmp/smtp-auth.log
          MSG=/tmp/mail-auth/msg-1.eml
          if [ ! -f "$MSG" ]; then echo "FAIL: no message received"; exit 1; fi
          cat "$MSG"
          grep -q '^X-Test-Auth: authuser:p4ssw0rd$' "$MSG" || { echo "FAIL: credentials not used"; exit 1; }
          grep -q '^Subject: Auth options test' "$MSG" || { echo "FAIL: subject missing"; exit 1; }
          grep -q 'recipient@example.com' "$MSG" || { echo "FAIL: recipient missing"; exit 1; }
          echo "PASS"
