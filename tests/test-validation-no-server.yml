name: Test validation - no server address
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send
        uses: .
        continue-on-error: true
        with:
          # Intentionally omitting server_address and connection_url
          subject: "Test Email"
          from: sender@example.com
          to: recipient@example.com
          body: "Test body"

      - name: Assert step failed with validation error
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail when no server address is specified, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step correctly failed when no server address specified"
