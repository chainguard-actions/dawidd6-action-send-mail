name: Test no recipients
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: "smtp.example.com"
          server_port: "25"
          subject: "Test Subject"
          from: "sender@example.com"
          body: "Test body"
          # No 'to', 'cc', or 'bcc' provided — should fail with "At least one of 'to', 'cc' or 'bcc' must be specified"
      - name: Assert action failed with no recipients error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no recipients are provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without any recipients"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
