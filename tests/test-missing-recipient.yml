name: Test missing recipient error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "Test Subject"
          from: sender@example.com
          # Intentionally omitting to, cc, and bcc

      - name: Assert action failed due to missing recipient
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "Outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when no recipient is specified, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: Action correctly failed when no recipient (to/cc/bcc) was provided"
