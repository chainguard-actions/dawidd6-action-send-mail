name: Test missing recipient validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send-mail
        uses: .
        continue-on-error: true
        with:
          server_address: 127.0.0.1
          server_port: "2525"
          secure: "false"
          subject: "Test Email"
          from: "sender@example.com"
          # Intentionally omitting 'to', 'cc', and 'bcc' to trigger validation error

      - name: Assert action failed with missing recipient error
        env:
          OUTCOME: ${{ steps.send-mail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no recipient is specified, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no recipient was provided"
