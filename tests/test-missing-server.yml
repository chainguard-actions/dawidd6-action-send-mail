name: Test missing server address error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send
        uses: .
        continue-on-error: true
        with:
          subject: "Test Subject"
          from: sender@example.com
          to: recipient@example.com
          body: "Test body"
          # Intentionally omitting server_address and connection_url

      - name: Assert action failed due to missing server address
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "Outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when server_address is missing, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: Action correctly failed when server_address was not provided"
