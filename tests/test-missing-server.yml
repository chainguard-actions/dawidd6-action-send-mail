name: Test missing server address validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send-mail
        uses: .
        continue-on-error: true
        with:
          # Intentionally omitting server_address and connection_url to trigger validation error
          subject: "Test Email"
          to: "recipient@example.com"
          from: "sender@example.com"
          body: "Test body"

      - name: Assert action failed with missing server error
        env:
          OUTCOME: ${{ steps.send-mail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no server address is specified, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no server address was provided"
