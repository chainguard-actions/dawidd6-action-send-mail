name: Test missing server address fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send
        uses: .
        continue-on-error: true
        with:
          subject: "Test Email"
          from: sender@example.com
          to: recipient@example.com
          body: "Hello!"
          # No server_address or connection_url provided

      - name: Assert action failed with missing server error
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no server_address is provided, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when server_address was missing"
