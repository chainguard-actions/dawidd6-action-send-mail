name: Test email body from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local SMTP server
        run: |
          python3 -m smtpd -n -c DebuggingServer localhost:1025 &
          sleep 1
          echo "SMTP server started"

      - name: Create body file
        run: |
          echo "This email body was read from a file." > /tmp/email-body.txt
          echo "It contains multiple lines." >> /tmp/email-body.txt
          echo "Line three." >> /tmp/email-body.txt

      - id: send
        uses: .
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "File Body Test Email"
          from: sender@example.com
          to: recipient@example.com
          body: "file:///tmp/email-body.txt"

      - name: Assert step succeeded
        run: |
          echo "PASS: file body email send step completed without error"
