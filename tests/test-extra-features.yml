name: Test extra email features
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local SMTP server
        run: |
          python3 -m smtpd -n -c DebuggingServer localhost:1025 &
          sleep 1
          echo "SMTP server started"

      - name: Create attachment file
        run: |
          echo "This is a test attachment" > /tmp/attachment.txt

      - id: action
        uses: .
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          username: testuser
          password: testpass
          subject: "Test Subject Extra Features"
          to: recipient@example.com
          from: sender@example.com
          body: "This is a **markdown** body."
          convert_markdown: "true"
          ignore_cert: "true"
          attachments: /tmp/attachment.txt
          nodemailerlog: "true"
          nodemailerdebug: "true"
          envelope_from: envelope-sender@example.com
          envelope_to: envelope-recipient@example.com
          priority: low

      - name: Assert action completed
        run: |
          echo "Action completed successfully with extra features"
          echo "PASS"
