name: Test attachments, nodemailerlog, nodemailerdebug inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create attachment file
        run: |
          echo "This is a test attachment" > /tmp/test-attachment.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "25"
          username: testuser
          password: testpass
          subject: "Test email with attachments and debug"
          to: recipient@example.com
          from: sender@example.com
          body: "Test body with attachment"
          attachments: /tmp/test-attachment.txt
          nodemailerlog: "true"
          nodemailerdebug: "true"
      - name: Assert action ran (expected to fail - no real SMTP server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real SMTP server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
