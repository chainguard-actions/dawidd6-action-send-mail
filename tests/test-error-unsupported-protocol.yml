name: Test error on unsupported connection_url protocol
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          connection_url: http://user:pass@127.0.0.1:2525
          subject: Bad protocol
          to: a@example.com
          from: sender@example.com
          body: should not send
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported protocol"
            exit 1
          fi
          echo "PASS"
