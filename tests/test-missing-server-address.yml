name: Test missing server address
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          subject: "Test Subject"
          from: "sender@example.com"
          to: "recipient@example.com"
          body: "Test body"
          # No server_address or connection_url provided — should fail with "Server address must be specified"
      - name: Assert action failed with missing server address error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no server address is provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without a server address"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
