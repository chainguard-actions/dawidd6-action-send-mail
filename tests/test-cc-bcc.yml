name: Test cc and bcc recipients
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake SMTP server
        run: |
          rm -rf /tmp/smtp-out && mkdir -p /tmp/smtp-out
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/smtp-server.cjs" 2525 /tmp/smtp-out > /tmp/smtp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if node -e "require('net').connect(2525,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              echo "server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/smtp-server.log
          exit 1
      - id: action
        uses: .
        with:
          server_address: 127.0.0.1
          server_port: "2525"
          subject: CC BCC test
          to: to1@example.com,to2@example.com
          cc: cc@example.com
          bcc: hidden@example.com
          from: sender@example.com
          body: cc bcc body
      - name: Assert recipients
        run: |
          f=/tmp/smtp-out/msg-1.eml
          if [ ! -f "$f" ]; then echo "FAIL: no message received"; cat /tmp/smtp-out/session.log || true; exit 1; fi
          cat "$f"
          for r in to1 to2 cc hidden; do
            grep -q "^ENVELOPE-TO: <$r@example.com>" "$f" || { echo "FAIL: missing envelope recipient $r"; exit 1; }
          done
          grep -q '^Cc: cc@example.com' "$f" || { echo "FAIL: Cc header"; exit 1; }
          if grep -qi '^Bcc:' "$f"; then echo "FAIL: Bcc header must not be present"; exit 1; fi
          echo "PASS"
