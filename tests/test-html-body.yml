name: Test HTML body email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local SMTP server
        run: |
          python3 -m smtpd -n -c DebuggingServer localhost:1025 &
          sleep 1
          echo "SMTP server started"

      - id: send
        uses: .
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "HTML Test Email"
          from: "Test Sender <sender@example.com>"
          to: recipient@example.com
          cc: cc@example.com
          html_body: "<h1>Hello</h1><p>This is an <strong>HTML</strong> email.</p>"

      - name: Assert step succeeded
        run: |
          echo "PASS: HTML email send step completed without error"
