name: Test basic plain-text email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local SMTP sink
        run: |
          rm -rf /tmp/mail-basic && mkdir -p /tmp/mail-basic
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/smtp_server.py" 2525 /tmp/mail-basic > /tmp/smtp-basic.log 2>&1 &
          for i in $(seq 1 40); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',2525),1).close()" 2>/dev/null; then
              echo "SMTP sink is up"; exit 0
            fi
            sleep 0.5
          done
          echo "FAIL: SMTP sink did not start"; cat /tmp/smtp-basic.log; exit 1
      - id: action
        uses: .
        with:
          server_address: 127.0.0.1
          server_port: "2525"
          subject: Basic test subject
          from: Test Sender <sender@example.com>
          to: recipient@example.com
          body: Hello from the basic test
      - name: Assert message received
        run: |
          sleep 1
          cat /tmp/smtp-basic.log
          ls -la /tmp/mail-basic
          MSG=/tmp/mail-basic/msg-1.eml
          if [ ! -f "$MSG" ]; then echo "FAIL: no message received"; exit 1; fi
          cat "$MSG"
          grep -q '^Subject: Basic test subject' "$MSG" || { echo "FAIL: subject missing"; exit 1; }
          grep -q '^To: recipient@example.com' "$MSG" || { echo "FAIL: To header missing"; exit 1; }
          grep -q '^From: Test Sender <sender@example.com>' "$MSG" || { echo "FAIL: From header missing"; exit 1; }
          grep -q 'Hello from the basic test' "$MSG" || { echo "FAIL: body missing"; exit 1; }
          grep -q '^X-Test-Envelope-From: FROM:<sender@example.com>' "$MSG" || { echo "FAIL: envelope from wrong"; exit 1; }
          grep -q '^X-Test-Envelope-To: TO:<recipient@example.com>' "$MSG" || { echo "FAIL: envelope to wrong"; exit 1; }
          grep -q '^X-Test-Auth: $' "$MSG" || { echo "FAIL: unexpected auth"; exit 1; }
          echo "PASS"
