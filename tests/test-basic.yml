name: Test basic plain-text email
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake SMTP server
        run: |
          rm -rf /tmp/smtp-out && mkdir -p /tmp/smtp-out
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/smtp-server.cjs" 2525 /tmp/smtp-out > /tmp/smtp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if node -e "require('net').connect(2525,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              echo "server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/smtp-server.log
          exit 1
      - id: action
        uses: .
        with:
          server_address: 127.0.0.1
          server_port: "2525"
          subject: Basic test subject
          to: alice@example.com
          from: Test Sender <sender@example.com>
          body: Hello from the basic test body
      - name: Assert message received
        run: |
          ls -la /tmp/smtp-out
          f=/tmp/smtp-out/msg-1.eml
          if [ ! -f "$f" ]; then echo "FAIL: no message received"; cat /tmp/smtp-out/session.log || true; exit 1; fi
          cat "$f"
          grep -q '^ENVELOPE-FROM: <sender@example.com>' "$f" || { echo "FAIL: envelope from"; exit 1; }
          grep -q '^ENVELOPE-TO: <alice@example.com>' "$f" || { echo "FAIL: envelope to"; exit 1; }
          grep -q '^Subject: Basic test subject' "$f" || { echo "FAIL: subject"; exit 1; }
          grep -q '^To: alice@example.com' "$f" || { echo "FAIL: To header"; exit 1; }
          grep -q '^From: Test Sender <sender@example.com>' "$f" || { echo "FAIL: From header"; exit 1; }
          grep -q 'Hello from the basic test body' "$f" || { echo "FAIL: body"; exit 1; }
          echo "PASS"
