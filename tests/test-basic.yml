name: Test basic email send (core inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake SMTP server
        run: |
          # Start a simple TCP listener on port 2525 to act as a fake SMTP server
          # We use python's smtpd module for a minimal SMTP server
          python3 -m smtpd -n -c DebuggingServer localhost:2525 &
          SMTP_PID=$!
          echo "SMTP_PID=$SMTP_PID" >> $GITHUB_ENV
          sleep 1
          echo "Fake SMTP server started on port 2525"
      - id: send-mail
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "2525"
          secure: "false"
          username: testuser
          password: testpassword
          subject: Test Email Subject
          to: recipient@example.com
          from: Sender Name <sender@example.com>
          body: This is the plain text body of the test email.
      - name: Stop fake SMTP server
        if: always()
        run: |
          if [ -n "$SMTP_PID" ]; then
            kill $SMTP_PID 2>/dev/null || true
          fi
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.send-mail.outcome }}"
          echo "PASS: All core inputs were accepted by the action"
