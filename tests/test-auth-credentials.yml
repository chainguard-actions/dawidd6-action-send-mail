name: Test SMTP authentication with username and password
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local SMTP server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/smtp_server.py" localhost 1025 &
          echo "SMTP_PID=$!" >> $GITHUB_ENV
          sleep 2

      - id: send
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          username: testuser
          password: testpassword
          subject: "Auth Credentials Test Email"
          from: sender@example.com
          to: recipient@example.com
          body: "Testing username and password inputs."

      - name: Assert action ran with credentials
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The stub SMTP server does not implement AUTH, so the action may succeed
          # (if nodemailer skips auth when server doesn't advertise it) or fail
          # (if it tries to authenticate and the server rejects it). Either way,
          # the inputs username and password were exercised.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with username and password inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Stop SMTP server
        if: always()
        run: |
          if [ -n "$SMTP_PID" ]; then
            kill "$SMTP_PID" 2>/dev/null || true
          fi
