name: Test BCC-only recipients
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local SMTP server
        run: |
          python3 -m smtpd -n -c DebuggingServer localhost:1025 &
          sleep 1
          echo "SMTP server started"

      - id: send
        uses: .
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "BCC Only Test Email"
          from: sender@example.com
          bcc: bcc-recipient@example.com
          body: "This email was sent with only BCC recipients"

      - name: Assert step succeeded
        run: |
          echo "PASS: BCC-only email send step completed without error"
