name: Test cc, bcc, reply-to, priority and custom headers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local SMTP sink
        run: |
          rm -rf /tmp/mail-hdr && mkdir -p /tmp/mail-hdr
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/smtp_server.py" 2528 /tmp/mail-hdr > /tmp/smtp-hdr.log 2>&1 &
          for i in $(seq 1 40); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',2528),1).close()" 2>/dev/null; then
              echo "SMTP sink is up"; exit 0
            fi
            sleep 0.5
          done
          echo "FAIL: SMTP sink did not start"; cat /tmp/smtp-hdr.log; exit 1
      - id: action
        uses: .
        with:
          server_address: 127.0.0.1
          server_port: "2528"
          subject: Header test
          from: sender@example.com
          to: to@example.com
          cc: cc@example.com
          bcc: hidden@example.com
          reply_to: reply@example.com
          in_reply_to: <orig-123@example.com>
          priority: high
          headers: '{"X-Custom-Header": "custom-value"}'
          body: Header body
      - name: Assert headers
        run: |
          sleep 1
          cat /tmp/smtp-hdr.log
          MSG=/tmp/mail-hdr/msg-1.eml
          if [ ! -f "$MSG" ]; then echo "FAIL: no message received"; exit 1; fi
          cat "$MSG"
          grep -q '^Cc: cc@example.com' "$MSG" || { echo "FAIL: Cc header missing"; exit 1; }
          grep -q '^Reply-To: reply@example.com' "$MSG" || { echo "FAIL: Reply-To missing"; exit 1; }
          grep -q '^In-Reply-To: <orig-123@example.com>' "$MSG" || { echo "FAIL: In-Reply-To missing"; exit 1; }
          grep -q '^References: <orig-123@example.com>' "$MSG" || { echo "FAIL: References missing"; exit 1; }
          grep -q '^X-Priority: 1' "$MSG" || { echo "FAIL: priority missing"; exit 1; }
          grep -q '^X-Custom-Header: custom-value' "$MSG" || { echo "FAIL: custom header missing"; exit 1; }
          if grep -qi '^Bcc:' "$MSG"; then echo "FAIL: Bcc header leaked"; exit 1; fi
          for r in to cc hidden; do
            grep -q "^X-Test-Envelope-To: TO:<$r@example.com>" "$MSG" || { echo "FAIL: envelope recipient $r missing"; exit 1; }
          done
          echo "PASS"
