name: Test attachments and custom envelope addresses
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test attachment file
        run: |
          echo "This is a test attachment" > /tmp/test-attachment.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: "127.0.0.1"
          server_port: "9999"
          subject: "Test Email with Attachments"
          from: "sender@example.com"
          to: "recipient@example.com"
          body: "Test body with attachment"
          attachments: "/tmp/test-attachment.txt"
          envelope_from: "envelope-sender@example.com"
          envelope_to: "envelope-recipient@example.com"
          # Action will fail at SMTP connection (no server at 127.0.0.1:9999)
          # but all inputs should be accepted without validation errors
      - name: Assert action failed at SMTP connection (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (SMTP connection refused to 127.0.0.1:9999)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not have succeeded without a real SMTP server"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
