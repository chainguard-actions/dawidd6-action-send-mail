name: Test error on invalid from address
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send-mail
        uses: .
        continue-on-error: true
        with:
          server_address: 127.0.0.1
          server_port: "19999"
          secure: "false"
          subject: "Test Invalid From"
          from: "not-a-valid-email-address"
          to: "recipient@example.com"
          body: "This email has an invalid from address."

      - name: Assert action failed with invalid from address
        env:
          OUTCOME: ${{ steps.send-mail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid from address, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid from address"
