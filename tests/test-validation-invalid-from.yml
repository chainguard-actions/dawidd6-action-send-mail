name: Test validation - invalid from address
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: send
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "Test Email"
          from: "not-a-valid-email-address"
          to: recipient@example.com
          body: "Test body"

      - name: Assert step failed with validation error
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with invalid from address, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step correctly failed with invalid from address"
