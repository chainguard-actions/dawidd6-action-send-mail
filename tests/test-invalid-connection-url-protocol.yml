name: Test invalid connection URL protocol
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          connection_url: "ftp://user:password@smtp.example.com:21"
          subject: "Test Subject"
          from: "sender@example.com"
          to: "recipient@example.com"
          body: "Test body"
          # 'ftp:' protocol is not supported — should fail with "Unsupported connection protocol 'ftp:'"
      - name: Assert action failed with unsupported protocol error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with unsupported connection URL protocol"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with an unsupported protocol"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
