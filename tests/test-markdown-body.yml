name: Test markdown body conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local SMTP server
        run: |
          python3 -m smtpd -n -c DebuggingServer localhost:1025 &
          sleep 1
          echo "SMTP server started"

      - id: send
        uses: .
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "Markdown Test Email"
          from: sender@example.com
          to: recipient@example.com
          html_body: |
            # Hello World

            This is a **markdown** email with:
            - Item one
            - Item two
          convert_markdown: "true"

      - name: Assert step succeeded
        run: |
          echo "PASS: markdown email send step completed without error"
