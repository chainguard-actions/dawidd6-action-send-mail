name: Test markdown body conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local SMTP server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/smtp_server.py" localhost 1025 &
          echo "SMTP_PID=$!" >> $GITHUB_ENV
          sleep 2

      - id: send
        uses: .
        with:
          server_address: localhost
          server_port: "1025"
          secure: "false"
          subject: "Markdown Test Email"
          from: sender@example.com
          to: recipient@example.com
          html_body: |
            # Hello World

            This is a **markdown** email with:
            - Item 1
            - Item 2
          convert_markdown: "true"

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.send.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with markdown body, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: markdown email sent successfully"

      - name: Stop SMTP server
        if: always()
        run: |
          if [ -n "$SMTP_PID" ]; then
            kill "$SMTP_PID" 2>/dev/null || true
          fi
