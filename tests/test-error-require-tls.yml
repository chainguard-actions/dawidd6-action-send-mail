name: Test require_tls refuses server without STARTTLS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local SMTP sink (no STARTTLS support)
        run: |
          rm -rf /tmp/mail-reqtls && mkdir -p /tmp/mail-reqtls
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/smtp_server.py" 2532 /tmp/mail-reqtls > /tmp/smtp-reqtls.log 2>&1 &
          for i in $(seq 1 40); do
            if python3 -c "import socket;socket.create_connection(('127.0.0.1',2532),1).close()" 2>/dev/null; then
              echo "SMTP sink is up"; exit 0
            fi
            sleep 0.5
          done
          echo "FAIL: SMTP sink did not start"; cat /tmp/smtp-reqtls.log; exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: 127.0.0.1
          server_port: "2532"
          secure: "false"
          require_tls: "true"
          username: tlsuser
          password: tlspass
          subject: Require TLS test
          from: sender@example.com
          to: recipient@example.com
          body: This must not be sent
      - name: Assert action failed and nothing was sent
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          sleep 1
          echo "outcome: $OUTCOME"
          cat /tmp/smtp-reqtls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because server lacks STARTTLS"
            exit 1
          fi
          if ls /tmp/mail-reqtls/*.eml >/dev/null 2>&1; then
            echo "FAIL: a message was delivered despite require_tls"
            exit 1
          fi
          echo "PASS"
