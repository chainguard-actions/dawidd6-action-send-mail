name: Test require_tls refuses plaintext server
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake SMTP server (no STARTTLS support)
        run: |
          rm -rf /tmp/smtp-out && mkdir -p /tmp/smtp-out
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/smtp-server.cjs" 2525 /tmp/smtp-out > /tmp/smtp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if node -e "require('net').connect(2525,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              echo "server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/smtp-server.log
          exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_address: 127.0.0.1
          server_port: "2525"
          secure: "false"
          require_tls: "true"
          username: tlsuser
          password: tlspass
          subject: Require TLS test
          to: erin@example.com
          from: sender@example.com
          body: should not be sent
      - name: Assert action failed and nothing was sent
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/smtp-out/session.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when server lacks STARTTLS"
            exit 1
          fi
          if [ -f /tmp/smtp-out/auth.log ]; then
            echo "FAIL: credentials were sent in clear text"
            cat /tmp/smtp-out/auth.log
            exit 1
          fi
          if ls /tmp/smtp-out/msg-*.eml >/dev/null 2>&1; then
            echo "FAIL: message was delivered despite require_tls"
            exit 1
          fi
          echo "PASS"
