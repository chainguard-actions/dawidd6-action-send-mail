name: Test extra email inputs (markdown, attachments, headers, envelope)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake SMTP server
        run: |
          python3 -m smtpd -n -c DebuggingServer localhost:2525 &
          SMTP_PID=$!
          echo "SMTP_PID=$SMTP_PID" >> $GITHUB_ENV
          sleep 1
          echo "Fake SMTP server started on port 2525"
      - name: Create attachment file
        run: |
          echo "This is a test attachment" > /tmp/test-attachment.txt
      - id: send-mail
        uses: .
        continue-on-error: true
        with:
          server_address: localhost
          server_port: "2525"
          secure: "false"
          subject: Extra Inputs Test Email
          to: recipient@example.com
          from: sender@example.com
          body: "# Hello\n\nThis is **markdown** content."
          convert_markdown: "true"
          attachments: /tmp/test-attachment.txt
          headers: '{"X-Custom-Header": "test-value", "X-Another-Header": "another-value"}'
          nodemailerlog: "true"
          nodemailerdebug: "true"
          envelope_from: envelope-sender@example.com
          envelope_to: envelope-recipient@example.com
          priority: low
      - name: Stop fake SMTP server
        if: always()
        run: |
          if [ -n "$SMTP_PID" ]; then
            kill $SMTP_PID 2>/dev/null || true
          fi
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.send-mail.outcome }}"
          echo "PASS: All extra inputs were accepted by the action"
