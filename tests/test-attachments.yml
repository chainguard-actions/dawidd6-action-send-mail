name: Test attachments and body from file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake SMTP server
        run: |
          rm -rf /tmp/smtp-out && mkdir -p /tmp/smtp-out
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/smtp-server.cjs" 2525 /tmp/smtp-out > /tmp/smtp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if node -e "require('net').connect(2525,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              echo "server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/smtp-server.log
          exit 1
      - name: Create files
        run: |
          mkdir -p /tmp/attach
          echo "report one" > /tmp/attach/report1.txt
          echo "report two" > /tmp/attach/report2.txt
          echo "single" > /tmp/single.log
          echo "Body loaded from a file" > /tmp/body.txt
      - id: action
        uses: .
        with:
          server_address: 127.0.0.1
          server_port: "2525"
          subject: Attachments test
          to: dave@example.com
          from: sender@example.com
          body: file:///tmp/body.txt
          attachments: /tmp/attach/*.txt,/tmp/single.log
      - name: Assert attachments
        run: |
          f=/tmp/smtp-out/msg-1.eml
          if [ ! -f "$f" ]; then echo "FAIL: no message received"; cat /tmp/smtp-out/session.log || true; exit 1; fi
          cat "$f"
          grep -q 'Body loaded from a file' "$f" || { echo "FAIL: body from file"; exit 1; }
          grep -qi 'multipart/mixed' "$f" || { echo "FAIL: not multipart"; exit 1; }
          for n in report1.txt report2.txt single.log; do
            grep -q "$n" "$f" || { echo "FAIL: missing attachment $n"; exit 1; }
          done
          echo "PASS"
